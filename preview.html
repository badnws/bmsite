<script type="module">
const ROOT = new URL('./', location.href).href;
const PUBLIC = ROOT + 'public/';
const ENV = '({BASE_URL:' + JSON.stringify(PUBLIC) + ',MODE:"preview",DEV:true,PROD:false,VITE_HASH_ROUTER:"1"})';
const mods = new Map(); const css = [];
async function text(p){ const r = await fetch(ROOT + p); if (!r.ok) return null; if ((r.headers.get('content-type')||'').includes('text/html')) return null; return r.text(); }
async function locate(p){ const c = /\.(tsx?|css|js)$/.test(p) ? [p] : [p+'.tsx', p+'.ts', p+'/index.tsx', p+'/index.ts']; for (const f of c){ const t = await text(f); if (t != null) return [f, t]; } throw new Error('Módulo não encontrado: ' + p); }
function norm(from, spec){ if (spec.startsWith('@/')) return 'src/' + spec.slice(2); const parts = from.split('/'); parts.pop(); for (const s of spec.split('/')){ if (s === '.' || !s) continue; if (s === '..') parts.pop(); else parts.push(s); } return parts.join('/'); }
function load(spec, from){ const p = from ? norm(from, spec) : spec; if (!mods.has(p)) mods.set(p, build(p)); return mods.get(p); }
async function build(p){
  const [file, src] = await locate(p);
  if (file.endsWith('.css')) { css.push(src.replace(/url\((["'])\//g, 'url($1' + PUBLIC)); return null; }
  let code = Babel.transform(src, { filename: file, presets: [['typescript', { isTSX: file.endsWith('.tsx'), allExtensions: true }], ['react', { runtime: 'automatic' }]] }).code;
  code = code.replace(/import\.meta\.env/g, ENV);
  const specs = new Set(); const re = /\bfrom\s*(['"])([^'"]+)\1|\bimport\s*(['"])([^'"]+)\3/g; let m;
  while ((m = re.exec(code))) { const s = m[2] || m[4]; if (s.startsWith('.') || s.startsWith('@/')) specs.add(s); }
  const urls = {}; await Promise.all([...specs].map(async s => { urls[s] = await load(s, file); }));
  code = code.replace(/\bimport\s*(['"])([^'"]+)\1;?/g, (all, q, s) => (s in urls && !urls[s]) ? '' : all);
  code = code.replace(/(\bfrom\s*|\bimport\s*)(['"])([^'"]+)\2/g, (all, pre, q, s) => urls[s] ? pre + q + urls[s] + q : all);
  return URL.createObjectURL(new Blob([code + '\n//# sourceURL=' + ROOT + file], { type: 'text/javascript' }));
}
try {
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.tailwindcss.com/3.4.16?plugins=typography'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const cfg = { ...(await import(await load('tailwind.config.ts'))).default }; delete cfg.plugins; delete cfg.content;
  window.tailwind.config = cfg;
  const main = await load('src/main.tsx');
  const st = document.createElement('style'); st.setAttribute('type', 'text/tailwindcss'); st.textContent = css.join('\n'); document.head.appendChild(st);
  await import(main);
  document.getElementById('boot').remove();
} catch (e) { console.error(e); document.getElementById('boot').innerHTML = '<pre>' + String(e && e.stack || e) + '</pre>'; }
</script>
